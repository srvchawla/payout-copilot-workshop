name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Maven test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Prepare Docker for Testcontainers
        run: |
          mkdir -p "$HOME/.rd"
          ln -sf /var/run/docker.sock "$HOME/.rd/docker.sock"
          docker version

      - name: Run tests
        run: DOCKER_HOST="unix://$HOME/.rd/docker.sock" ./mvnw --batch-mode --no-transfer-progress test
