spring:
  application:
    name: payout-webhook-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:postgresql://localhost:5432/payout_workshop
    username: workshop
    password: workshop
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Shared secret used to verify inbound Payout-Transmission-Sig headers.
# Never commit a real secret here - this is workshop-only.
webhook:
  secret: ABCXYZ
  idempotency-ttl-hours: 24

# Bounded retry for concurrent credits racing on AccountBalance's @Version column.
ledger:
  optimistic-lock:
    max-attempts: 5

logging:
  level:
    com.payout.workshop: DEBUG
